[package]
name = "noonix_core"
version = "0.5.1"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"
cxx = { version = "1", optional = true }
cxx-qt = { version = "0.10", optional = true }
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "signal", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
once_cell = "1"
regex = "1"
sha2 = "0.11"
urlencoding = "2"
url = "2"
bytes = "1"
base64 = "0.23"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.4"
# torrent sources play through it (rustls, like reqwest here). download only: never uploads
librqbit = { version = "9.1", default-features = false, features = ["rust-tls", "disable-upload"] }
# network shares (smb, webdav, ftp): pure rust clients, so every platform has them
smb = { version = "0.12", default-features = false, features = ["async", "sign", "encrypt"] }
suppaftp = { version = "12", features = ["tokio"] }
quick-xml = "0.42"
minisign-verify = "0.3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", optional = true }

[features]
# qt: the qml singleton the linux/windows app uses. without it the core is a plain static library
# with a c interface (src/ffi.rs) for the native macos client
default = ["qt"]
qt = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1

# ios: the published one has no ios branch for binding to a device (its macos one works there)
[patch.crates-io]
librqbit-dualstack-sockets = { path = "vendor/librqbit-dualstack-sockets" }
