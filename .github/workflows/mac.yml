name: mac

# the native mac client (mac/: swiftui over the core's c interface), one app per arch (apple
# silicon, and intel for a release), ad-hoc signed.
# by hand (or a push to the ci-windows test branch) it lands as a run artifact; the release
# workflow calls it with its draft's tag
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mac/**', 'core/**', '.github/workflows/mac.yml']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      # intel runners are slow: intel only for a release, apple silicon always
      matrix:
        arch: ${{ fromJSON(inputs.tag != '' && '["arm64", "x86_64"]' || '["arm64"]') }}
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-26-intel' || 'macos-26' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NOONIX_UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: mac/.build/cargo
          key: cargo-mac-${{ matrix.arch }}-${{ hashFiles('core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-mac-${{ matrix.arch }}-${{ hashFiles('core/Cargo.lock') }}-
            cargo-mac-${{ matrix.arch }}-
      # mpvkit's prebuilt frameworks (~200 mb from github releases, which fail now and then)
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            mac/.build/artifacts
          key: swiftpm-mac-${{ matrix.arch }}-${{ hashFiles('mac/Package.swift') }}
      - name: build
        env:
          ARCHS: ${{ matrix.arch }}
          NOONIX_TMDB_API_KEY: ${{ secrets.NOONIX_TMDB_API_KEY }}
          NOONIX_TMDB_READ_TOKEN: ${{ secrets.NOONIX_TMDB_READ_TOKEN }}
          NOONIX_TRAKT_CLIENT_ID: ${{ secrets.NOONIX_TRAKT_CLIENT_ID }}
          NOONIX_TRAKT_CLIENT_SECRET: ${{ secrets.NOONIX_TRAKT_CLIENT_SECRET }}
          NOONIX_RELEASE: '1'
        run: mac/build.sh
      - name: zip
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)"
          cd mac/dist && ditto -c -k --keepParent "Noonix TV.app" "noonix-tv-$v-macos-${{ matrix.arch }}.zip"
      - if: inputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: noonix-tv-macos-${{ matrix.arch }}
          path: mac/dist/*.zip
          retention-days: 7
      # the core alone, for building the swift side on a mac without rust
      - if: inputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: noonix-core-macos-${{ matrix.arch }}
          path: mac/.build/core/libnoonix_core.a
          retention-days: 7
      # its line in SHA256SUMS too (publish keeps the lines of files it didn't make)
      - if: inputs.tag != ''
        run: |
          gh release upload "${{ inputs.tag }}" mac/dist/*.zip --clobber
          if gh release download "${{ inputs.tag }}" --pattern SHA256SUMS --dir sums 2> /dev/null; then
            zip="$(cd mac/dist && ls *.zip)"
            { grep -v "  $zip\$" sums/SHA256SUMS || true; (cd mac/dist && shasum -a 256 "$zip"); } > SHA256SUMS
            gh release upload "${{ inputs.tag }}" SHA256SUMS --clobber
          fi
