name: release

# a v* tag (tools/release.sh) builds the appimages (x86_64, aarch64), the windows setup, the mac
# apps and the android apks (arm64, armv7, x86_64), checks them end to end and publishes them with SHA256SUMS (the in-app
# updater reads it). the files travel between jobs on a draft release. workflow_dispatch builds the same things into a
# draft "ci-<run>" release (only the newest one is kept), never published
# the appimage's base is ubuntu 22.04 (glibc 2.35): it runs on ubuntu 22.04, debian 12 and newer.
# windows is cross-built on linux (llvm-mingw, tools/windows). "[linux]" in the tagged commit's message
# (tools/release.sh <version> --linux): a hotfix, only the appimages
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  # the in-app updater follows the repo that built it
  NOONIX_UPDATE_REPO: ${{ github.repository }}
  GH_VERSION: 2.103.2

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      linux: ${{ steps.tag.outputs.linux }}
    steps:
      - id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then t="$GITHUB_REF_NAME"; else t="ci-$GITHUB_RUN_ID"; fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GH_REPO/commits/$GITHUB_SHA" -q .commit.message | grep -qF '[linux]'; then echo "linux=true" >> "$GITHUB_OUTPUT"; fi
          # a rerun finds the draft from the first try
          gh release view "$t" > /dev/null 2>&1 || gh release create "$t" --draft --target "$GITHUB_SHA" --title "Noonix TV ${t#v}" --notes "building"

  appimage:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            base: jammy
            glibc: '2.35'
          # qt's official arm64 build needs glibc 2.38: this one runs on ubuntu 24.04, debian 13 and newer
          - arch: aarch64
            runner: ubuntu-24.04-arm
            base: noble
            glibc: '2.39'
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.base == 'noble' && 'ubuntu:24.04' || 'ubuntu:22.04' }}
      # the runner's own toolkits, mounted only to delete them: the build, the sources and the
      # smoke test don't fit in the free space otherwise
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        - /opt/hostedtoolcache/CodeQL:/host/codeql
    steps:
      - name: disk space
        run: |
          rm -rf /host/dotnet/* /host/android/* /host/ghc/* /host/codeql/*
          df -h / "$GITHUB_WORKSPACE"
      - name: git (for the checkout)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: system packages
        run: tools/appimage/base.sh
      # deps.sh's own stamp: a comment edit doesn't throw away a ~25 min build
      - id: deps
        run: echo "hash=$(grep -Ev '^[[:space:]]*(#|$)' tools/appimage/deps.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # qt, ffmpeg, mpv & co from pinned sources: ~25 min cold. saved right away, so a later
      # failure doesn't throw it away
      - uses: actions/cache/restore@v6
        id: deps-cache
        with:
          path: /opt/noonix
          key: deps-${{ matrix.base }}-${{ matrix.arch }}-${{ steps.deps.outputs.hash }}
      - name: bundled libraries
        run: tools/appimage/deps.sh /opt/noonix
      - uses: actions/cache/save@v6
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: /opt/noonix
          key: deps-${{ matrix.base }}-${{ matrix.arch }}-${{ steps.deps.outputs.hash }}
      - name: tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but core/Cargo.toml says $v"; exit 1; }
      # the release build of the rust core takes ~15 min cold
      - uses: actions/cache@v6
        with:
          path: build/out/work/cmake
          key: appbuild-${{ matrix.base }}-${{ matrix.arch }}-${{ hashFiles('core/Cargo.lock', 'CMakeLists.txt') }}-${{ steps.deps.outputs.hash }}-${{ github.sha }}
          # a new lock or deps still starts from the last build: cargo redoes only what changed
          restore-keys: |
            appbuild-${{ matrix.base }}-${{ matrix.arch }}-${{ hashFiles('core/Cargo.lock', 'CMakeLists.txt') }}-${{ steps.deps.outputs.hash }}-
            appbuild-${{ matrix.base }}-${{ matrix.arch }}-
      - name: appimage
        # noonix tv's own app keys (repo secrets), compiled in; NOONIX_RELEASE fails the build without them
        env:
          NOONIX_TMDB_API_KEY: ${{ secrets.NOONIX_TMDB_API_KEY }}
          NOONIX_TMDB_READ_TOKEN: ${{ secrets.NOONIX_TMDB_READ_TOKEN }}
          NOONIX_TRAKT_CLIENT_ID: ${{ secrets.NOONIX_TRAKT_CLIENT_ID }}
          NOONIX_TRAKT_CLIENT_SECRET: ${{ secrets.NOONIX_TRAKT_CLIENT_SECRET }}
          NOONIX_GLIBC_MAX: ${{ matrix.glibc }}
          NOONIX_RELEASE: '1'
        run: . /opt/noonix/env.sh && tools/build-appimage.sh build/out
      - name: smoke test
        run: tools/smoke-appimage.sh build/out/*.AppImage
      # matrix legs have no outputs of their own: the sum rides along as a .sha256 asset that
      # publish folds into SHA256SUMS
      - name: onto the draft
        run: |
          curl -fsSL "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_$(dpkg --print-architecture).tar.gz" \
            | tar -xz -C /usr/local --strip-components=1
          gh release upload "${{ needs.draft.outputs.tag }}" build/out/*.AppImage build/out/*.AppImage.sha256 --clobber

  windows:
    needs: draft
    if: needs.draft.outputs.linux != 'true'
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    outputs:
      sum: ${{ steps.upload.outputs.sum }}
    steps:
      - name: git (for the checkout)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: system packages
        run: tools/windows/base.sh
      - name: tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but core/Cargo.toml says $v"; exit 1; }
      # qt for windows + the linux host's tools, llvm-mingw, rust, sdl, libmpv
      - uses: actions/cache/restore@v6
        id: deps-cache
        with:
          path: /opt/noonix-win
          key: deps-win-${{ hashFiles('tools/windows/deps.sh', 'tools/windows/qt-win.py', 'tools/windows/env.sh') }}
      - name: toolchain and libraries
        run: tools/windows/deps.sh /opt/noonix-win
      - uses: actions/cache/save@v6
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: /opt/noonix-win
          key: deps-win-${{ hashFiles('tools/windows/deps.sh', 'tools/windows/qt-win.py', 'tools/windows/env.sh') }}
      - uses: actions/cache@v6
        with:
          path: build/win/cmake
          key: appbuild-win-${{ hashFiles('core/Cargo.lock', 'CMakeLists.txt', 'tools/windows/deps.sh') }}-${{ github.sha }}
          restore-keys: |
            appbuild-win-${{ hashFiles('core/Cargo.lock', 'CMakeLists.txt', 'tools/windows/deps.sh') }}-
            appbuild-win-
      - name: build
        env:
          NOONIX_TMDB_API_KEY: ${{ secrets.NOONIX_TMDB_API_KEY }}
          NOONIX_TMDB_READ_TOKEN: ${{ secrets.NOONIX_TMDB_READ_TOKEN }}
          NOONIX_TRAKT_CLIENT_ID: ${{ secrets.NOONIX_TRAKT_CLIENT_ID }}
          NOONIX_TRAKT_CLIENT_SECRET: ${{ secrets.NOONIX_TRAKT_CLIENT_SECRET }}
          NOONIX_RELEASE: '1'
        run: tools/windows/build.sh /opt/noonix-win build/win/cmake build/win/out
      - name: setup
        run: tools/windows/package.sh "build/win/out/Noonix TV" build/win/dist
      - name: onto the draft
        id: upload
        run: |
          curl -fsSL "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local --strip-components=1
          gh release upload "${{ needs.draft.outputs.tag }}" build/win/dist/*-setup.exe build/win/dist/*-windows-x64.zip --clobber
          { echo 'sum<<SUMS'; (cd build/win/dist && sha256sum *-setup.exe *-windows-x64.zip); echo SUMS; } >> "$GITHUB_OUTPUT"

  windows-smoke:
    needs: [draft, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: smoke test
        run: |
          gh release download "${{ needs.draft.outputs.tag }}" --pattern '*-setup.exe' --dir dist
          powershell -ExecutionPolicy Bypass -File tools\windows\smoke.ps1 (Get-Item dist\*-setup.exe).FullName

  # the mac preview: the release doesn't wait for it and the updater doesn't know it
  macos:
    needs: draft
    if: needs.draft.outputs.linux != 'true'
    uses: ./.github/workflows/mac.yml
    with:
      tag: ${{ needs.draft.outputs.tag }}
    secrets: inherit

  # the android app (tv boxes, tablets, phones in landscape): an arm64 apk, the full app, and an armv7
  # one for 32-bit tv boxes (no hdr or new rendering planned there), x86_64 for chromebooks and pc
  # boxes. a release's apks carry
  # the release key (secrets ANDROID_KEYSTORE / ANDROID_KEYSTORE_PASS, tools/android/keystore.sh);
  # without it the apk is only a run artifact, signed with a throwaway debug key
  android:
    needs: draft
    if: needs.draft.outputs.linux != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt: arm64_v8a
            rust: aarch64-linux-android
          - abi: armeabi-v7a
            qt: armv7
            rust: armv7-linux-androideabi
          - abi: x86_64
            qt: x86_64
            rust: x86_64-linux-android
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: 6.12.0
      NDK_VERSION: 27.2.12479018
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but core/Cargo.toml says $v"; exit 1; }
      - name: sdk, ndk, rust target
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build p7zip-full libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libglib2.0-0t64 libdbus-1-3 libgssapi-krb5-2
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" > /dev/null
          rustup target add ${{ matrix.rust }}
      - uses: actions/cache@v6
        id: qt-cache
        with:
          path: /opt/qt
          key: qt-android-${{ matrix.qt }}-${{ env.QT_VERSION }}-${{ hashFiles('tools/android/qt-fetch.py') }}
      - name: qt for android
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 tools/android/qt-fetch.py host "$QT_VERSION" /opt/qt/host qtshadertools
          python3 tools/android/qt-fetch.py android "$QT_VERSION" ${{ matrix.qt }} /opt/qt/android /opt/qt/host qtimageformats qtshadertools
      - uses: actions/cache@v6
        with:
          path: build/android/libmpv
          key: libmpv-android-${{ matrix.abi }}-${{ hashFiles('tools/android/libmpv.sh') }}
      - name: apk
        env:
          NOONIX_TMDB_API_KEY: ${{ secrets.NOONIX_TMDB_API_KEY }}
          NOONIX_TMDB_READ_TOKEN: ${{ secrets.NOONIX_TMDB_READ_TOKEN }}
          NOONIX_TRAKT_CLIENT_ID: ${{ secrets.NOONIX_TRAKT_CLIENT_ID }}
          NOONIX_TRAKT_CLIENT_SECRET: ${{ secrets.NOONIX_TRAKT_CLIENT_SECRET }}
          NOONIX_RELEASE: '1'
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64" ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE="$RUNNER_TEMP/release.keystore" KEYSTORE_ALIAS=noonix
          fi
          ABI=${{ matrix.abi }} QT_ANDROID=/opt/qt/android QT_HOST=/opt/qt/host tools/android/build.sh build/android
          cd build/android && sha256sum *.apk > "$(ls *.apk).sha256"
      - name: onto the draft
        if: env.HAS_KEY == 'true'
        run: gh release upload "${{ needs.draft.outputs.tag }}" build/android/*.apk build/android/*.apk.sha256 --clobber
      - if: env.HAS_KEY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: noonix-tv-android-${{ matrix.abi }}-debug-signed
          path: build/android/*.apk
          retention-days: 7

  # waits for every build; the mac and android ones may fail without holding the release back
  publish:
    needs: [draft, appimage, windows, windows-smoke, macos, android]
    if: ${{ !cancelled() && needs.appimage.result == 'success' && (needs.draft.outputs.linux == 'true' || (needs.windows-smoke.result == 'success' && needs.macos.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: publish
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          # each build leaves <file>.sha256 next to its file (windows hands its lines over)
          gh release download "$TAG" --pattern '*.sha256' --dir sums
          { cat sums/*.sha256; printf '%s\n' "${{ needs.windows.outputs.sum }}"; } | sed '/^$/d' > SHA256SUMS
          # a rebuild keeps the sums of the files it didn't make
          if gh release download "$TAG" --pattern SHA256SUMS --dir old 2> /dev/null; then
            awk 'NR == FNR { have[$2] = 1; next } !($2 in have)' SHA256SUMS old/SHA256SUMS > kept
            cat kept >> SHA256SUMS
          fi
          gh release upload "$TAG" SHA256SUMS --clobber
          for f in sums/*.sha256; do gh release delete-asset "$TAG" "$(basename "$f")" --yes; done
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            # a test build stays a draft; older test drafts go
            gh release list --limit 100 --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName' \
              | grep '^ci-' | grep -vx "$TAG" | xargs -r -n1 gh release delete --yes
            exit 0
          fi
          # a rebuild of a published release keeps its written notes
          if [ "$(gh release view "$TAG" --json body -q .body)" != building ]; then
            gh release edit "$TAG" --draft=false
            exit 0
          fi
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "## Changes"
            if [ -n "$prev" ]; then git log --format='- %s' "$prev..$TAG"; else echo "- first release"; fi
          } > notes.md
          gh release edit "$TAG" --draft=false --notes-file notes.md

  # aur: a job here (needs: publish, tags without '-') would run packaging/aur/bump.sh and publish.sh with an
  # AUR_SSH_KEY secret. paused: the aur isn't taking new accounts
